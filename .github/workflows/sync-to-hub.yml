name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@latest
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: nafiurahman/AgentTell
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: dataset
